<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERY AI V12 GITHUB EDITION</title>
<style>
body{margin:0;background:#07111e;color:#fff;font-family:Arial,sans-serif}
.header{padding:16px;background:#101b31;position:sticky;top:0}
.wrap{max-width:1280px;margin:auto;padding:12px}
.card{background:#111d33;padding:15px;border-radius:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
input,button,select{width:100%;padding:12px;border-radius:10px;border:none}
input,select{background:#1a2944;color:white}
button{background:#d4af37;font-weight:bold}
.buy{color:#3ecf82}.sell{color:#ff6b6b}.wait{color:#ffd166}
.big{font-size:42px;font-weight:bold}
iframe{width:100%;height:450px;border:none;border-radius:12px}
</style>
</head>
<body>
<div class="header">
<h2>FERY AI V12 ULTRA AI</h2>
<div id="status">WS: CONNECTING...</div>
</div>

<div class="wrap">
<div class="card">
<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=15&theme=dark"></iframe>
</div>

<div class="grid">
<div class="card">Price<br><b id="price">--</b></div>
<div class="card">Session<br><b id="session">--</b></div>
<div class="card">RSI<br><b id="rsi">--</b></div>
<div class="card">Confidence<br><b id="conf">--%</b></div>
<div class="card">Trend<br><b id="trend">--</b></div>
</div>

<div class="card">
<input id="broker" placeholder="Harga Broker MT5 (opsional)">
<br><br>
<button onclick="analyze()">GENERATE SIGNAL</button>
</div>

<div class="card">
<div id="signal" class="big wait">WAIT</div>
</div>

<div class="grid">
<div class="card">Entry<br><b id="entry">-</b></div>
<div class="card">SL<br><b id="sl">-</b></div>
<div class="card">TP1<br><b id="tp1">-</b></div>
<div class="card">TP2<br><b id="tp2">-</b></div>
<div class="card">TP3<br><b id="tp3">-</b></div>
</div>
</div>

<script>
let prices=[];
let livePrice=0;

function sessionName(){
 let h=new Date().getUTCHours();
 if(h<7) return "TOKYO";
 if(h<13) return "LONDON";
 if(h<22) return "NEW YORK";
 return "SYDNEY";
}

document.getElementById("session").innerText=sessionName();

function connect(){
 try{
   const ws=new WebSocket("wss://stream.binance.com:9443/ws/paxgusdt@trade");

   ws.onopen=()=>{
      document.getElementById("status").innerText="WS: LIVE";
   };

   ws.onmessage=(e)=>{
      const d=JSON.parse(e.data);
      livePrice=parseFloat(d.p);
      prices.push(livePrice);
      if(prices.length>300) prices.shift();

      document.getElementById("price").innerText=livePrice.toFixed(2);
   };

   ws.onclose=()=>{
      document.getElementById("status").innerText="WS: RECONNECTING";
      setTimeout(connect,3000);
   };

 }catch(e){
   document.getElementById("status").innerText="WS ERROR";
 }
}

function ema(arr,p){
 if(arr.length<p) return arr[arr.length-1]||0;
 let k=2/(p+1),e=arr[0];
 for(let i=1;i<arr.length;i++) e=arr[i]*k+e*(1-k);
 return e;
}

function rsi(arr,p=14){
 if(arr.length<p+1) return 50;
 let g=0,l=0;
 for(let i=arr.length-p;i<arr.length;i++){
   let d=arr[i]-arr[i-1];
   if(d>0) g+=d; else l-=d;
 }
 let rs=g/(l||0.0001);
 return 100-(100/(1+rs));
}

function analyze(){
 if(prices.length<30){
   alert("Data belum cukup");
   return;
 }

 let broker=parseFloat(document.getElementById("broker").value);
 if(isNaN(broker)) broker=livePrice;

 let e20=ema(prices,20);
 let e50=ema(prices,50);
 let R=rsi(prices);

 let conf=50;
 if(e20>e50) conf+=25;
 if(R>55) conf+=25;

 let signal="WAIT";

 if(conf>=75) signal="BUY";
 else if(conf<=25) signal="SELL";

 let atr=Math.max(livePrice*0.001,1);

 let sl,tp1,tp2,tp3;

 if(signal==="BUY"){
   sl=broker-atr;
   tp1=broker+atr*1.5;
   tp2=broker+atr*3;
   tp3=broker+atr*5;
 }

 if(signal==="SELL"){
   sl=broker+atr;
   tp1=broker-atr*1.5;
   tp2=broker-atr*3;
   tp3=broker-atr*5;
 }

 if(signal==="WAIT"){
   sl=tp1=tp2=tp3=broker;
 }

 document.getElementById("signal").innerText=signal;
 document.getElementById("signal").className="big "+signal.toLowerCase();
 document.getElementById("conf").innerText=conf+"%";
 document.getElementById("rsi").innerText=R.toFixed(1);
 document.getElementById("trend").innerText=e20>e50?"UPTREND":"DOWNTREND";

 entry.innerText=broker.toFixed(2);
 document.getElementById("sl").innerText=sl.toFixed(2);
 document.getElementById("tp1").innerText=tp1.toFixed(2);
 document.getElementById("tp2").innerText=tp2.toFixed(2);
 document.getElementById("tp3").innerText=tp3.toFixed(2);
}

connect();
</script>
</body>
</html>
