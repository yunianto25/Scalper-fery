<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERY AI V11 PRO MAX</title>
<style>
body{margin:0;background:#08111f;color:#eef;font-family:Arial,sans-serif}
.header{padding:18px;background:#101c31;position:sticky;top:0}
.wrap{max-width:1200px;margin:auto;padding:15px}
.card{background:#111d33;border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,button{width:100%;padding:12px;border:none;border-radius:10px}
input{background:#1a2944;color:#fff}
button{background:#d4af37;font-weight:bold}
.buy{color:#3ecf82}.sell{color:#ff6b6b}.wait{color:#ffd166}
.big{font-size:38px;font-weight:bold}
iframe{width:100%;height:420px;border:none;border-radius:12px}
.progress{height:10px;background:#1a2944;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0%}
</style>
</head>
<body>
<div class="header">
<h2>FERY AI V11 PRO MAX</h2>
<div id="session">Session: Loading...</div>
</div>

<div class="wrap">
<div class="card">
<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=15&theme=dark"></iframe>
</div>

<div class="grid">
<div class="card"><b>API</b><div id="api">CONNECTING</div></div>
<div class="card"><b>Price</b><div id="price">--</div></div>
<div class="card"><b>RSI</b><div id="rsi">--</div></div>
<div class="card"><b>ATR</b><div id="atr">--</div></div>
<div class="card"><b>Confidence</b><div id="conf">0%</div><div class="progress"><div id="bar" class="bar"></div></div></div>
</div>

<div class="card">
<input id="broker" placeholder="Harga broker MT5">
<br><br>
<button onclick="analyze()">GENERATE SIGNAL</button>
</div>

<div class="card">
<div id="signal" class="big wait">WAIT</div>
</div>

<div class="grid">
<div class="card">Entry<br><b id="entry">-</b></div>
<div class="card">SL<br><b id="sl">-</b></div>
<div class="card">TP1<br><b id="tp1">-</b></div>
<div class="card">TP2<br><b id="tp2">-</b></div>
<div class="card">TP3<br><b id="tp3">-</b></div>
</div>
</div>

<script>
let closes=[],candles=[];

function ema(arr,p){let k=2/(p+1),e=arr[0];for(let i=1;i<arr.length;i++)e=arr[i]*k+e*(1-k);return e;}
function rsi(arr,p=14){let g=0,l=0;for(let i=arr.length-p;i<arr.length;i++){let d=arr[i]-arr[i-1];if(d>0)g+=d;else l-=d;}let rs=g/(l||0.0001);return 100-(100/(1+rs));}
function atr(data,p=14){let t=[];for(let i=1;i<data.length;i++){t.push(Math.max(data[i].h-data[i].l,Math.abs(data[i].h-data[i-1].c),Math.abs(data[i].l-data[i-1].c)));}let r=t.slice(-p);return r.reduce((a,b)=>a+b,0)/r.length;}

async function loadData(){
 const urls=[
 'https://api.bybit.com/v5/market/kline?category=spot&symbol=PAXGUSDT&interval=15&limit=200',
 'https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=200'
 ];
 for(const u of urls){
  try{
   const r=await fetch(u);
   const j=await r.json();
   if(u.includes('bybit')){
      candles=j.result.list.reverse().map(x=>({h:+x[2],l:+x[3],c:+x[4]}));
   }else{
      candles=j.map(x=>({h:+x[2],l:+x[3],c:+x[4]}));
   }
   closes=candles.map(x=>x.c);
   document.getElementById('price').innerText=closes.at(-1).toFixed(2);
   document.getElementById('api').innerText='LIVE';
   document.getElementById('rsi').innerText=rsi(closes).toFixed(1);
   document.getElementById('atr').innerText=atr(candles).toFixed(2);
   return;
  }catch(e){}
 }
 document.getElementById('api').innerText='OFFLINE';
}

function analyze(){
 if(closes.length<50) return;
 const broker=parseFloat(document.getElementById('broker').value||closes.at(-1));
 const e20=ema(closes,20),e50=ema(closes,50),e200=ema(closes,Math.min(200,closes.length-1));
 const R=rsi(closes),A=atr(candles);
 let score=0;
 if(e20>e50)score+=25;
 if(e50>e200)score+=25;
 if(R>55)score+=25;
 if(A>0)score+=25;
 let signal='WAIT';
 if(score>=75) signal='BUY';
 else if(score<=25) signal='SELL';
 document.getElementById('signal').innerText=signal;
 document.getElementById('signal').className='big '+signal.toLowerCase();
 document.getElementById('conf').innerText=score+'%';
 document.getElementById('bar').style.width=score+'%';
 let sl,tp1,tp2,tp3;
 if(signal==='BUY'){sl=broker-A;tp1=broker+A*1.5;tp2=broker+A*3;tp3=broker+A*5;}
 else if(signal==='SELL'){sl=broker+A;tp1=broker-A*1.5;tp2=broker-A*3;tp3=broker-A*5;}
 else{sl=tp1=tp2=tp3=broker;}
 ['entry','sl','tp1','tp2','tp3'].forEach(id=>document.getElementById(id).innerText=eval(id).toFixed(2));
}

function updateSession(){
 let h=new Date().getUTCHours();
 let s='Sydney';
 if(h>=0&&h<8)s='Tokyo';
 if(h>=7&&h<16)s='London';
 if(h>=13&&h<22)s='New York';
 document.getElementById('session').innerText='Session: '+s;
}
updateSession(); loadData(); setInterval(loadData,60000);
</script>
</body>
</html>
