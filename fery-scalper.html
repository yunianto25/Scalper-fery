<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERY AI V10 PRO MAX</title>
<style>
body{margin:0;background:#08111f;color:#eef;font-family:Arial,sans-serif}
.header{padding:20px;background:#101c31}
.wrap{max-width:1200px;margin:auto;padding:15px}
.card{background:#111d33;border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,button{width:100%;padding:12px;border:none;border-radius:10px}
input{background:#1a2944;color:#fff}
button{background:#d4af37;font-weight:bold}
.buy{color:#3ecf82}.sell{color:#ff6b6b}.wait{color:#aab7c8}
.big{font-size:38px;font-weight:bold}
.small{font-size:12px;color:#9fb2cc}
iframe{width:100%;height:420px;border:none;border-radius:12px}
</style>
</head>
<body>
<div class="header">
<h2>FERY AI V10 PRO MAX</h2>
<div class="small">EMA20/50/200 • RSI14 • ATR14 • Broker Offset • TradingView</div>
</div>

<div class="wrap">

<div class="card">
<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=15&theme=dark"></iframe>
</div>

<div class="card">
<label>Harga Broker MT5</label>
<input id="broker" placeholder="3378.50">
<br><br>
<button onclick="analyze()">GENERATE SIGNAL</button>
</div>

<div class="grid">
<div class="card"><div class="small">PAXG</div><div id="price">Loading...</div></div>
<div class="card"><div class="small">RSI</div><div id="rsi">--</div></div>
<div class="card"><div class="small">ATR</div><div id="atr">--</div></div>
<div class="card"><div class="small">Confidence</div><div id="conf">--%</div></div>
</div>

<div class="card">
<div id="signal" class="big wait">WAIT</div>
</div>

<div class="grid">
<div class="card">Entry<br><b id="entry">-</b></div>
<div class="card">SL<br><b id="sl">-</b></div>
<div class="card">TP1<br><b id="tp1">-</b></div>
<div class="card">TP2<br><b id="tp2">-</b></div>
</div>

</div>

<script>
let closes=[], candles=[];

function ema(arr,p){let k=2/(p+1),e=arr[0];for(let i=1;i<arr.length;i++)e=arr[i]*k+e*(1-k);return e;}
function rsi(arr,p=14){
 let g=0,l=0;
 for(let i=arr.length-p;i<arr.length;i++){
  let d=arr[i]-arr[i-1];
  if(d>0)g+=d;else l-=d;
 }
 let rs=g/(l||0.0001);
 return 100-(100/(1+rs));
}
function atr(data,p=14){
 let t=[];
 for(let i=1;i<data.length;i++){
  t.push(Math.max(data[i].h-data[i].l,Math.abs(data[i].h-data[i-1].c),Math.abs(data[i].l-data[i-1].c)));
 }
 let r=t.slice(-p);
 return r.reduce((a,b)=>a+b,0)/r.length;
}

async function loadData(){
 try{
  let r=await fetch("https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=250");
  let d=await r.json();
  candles=d.map(x=>({h:+x[2],l:+x[3],c:+x[4]}));
  closes=candles.map(x=>x.c);
  document.getElementById("price").innerText=closes.at(-1).toFixed(2);
  document.getElementById("rsi").innerText=rsi(closes).toFixed(1);
  document.getElementById("atr").innerText=atr(candles).toFixed(2);
 }catch(e){
  document.getElementById("price").innerText="API Error";
 }
}

function analyze(){
 if(closes.length<200){alert("Data belum siap");return;}
 const broker=parseFloat(document.getElementById("broker").value);
 if(isNaN(broker)){alert("Masukkan harga broker");return;}

 const e20=ema(closes,20), e50=ema(closes,50), e200=ema(closes,200);
 const R=rsi(closes), A=atr(candles);

 let signal="WAIT", conf=50;
 if(e20>e50 && e50>e200 && R>55){signal="BUY";conf=85;}
 else if(e20<e50 && e50<e200 && R<45){signal="SELL";conf=85;}

 let sl,tp1,tp2;
 if(signal==="BUY"){sl=broker-A;tp1=broker+A*1.5;tp2=broker+A*3;}
 else if(signal==="SELL"){sl=broker+A;tp1=broker-A*1.5;tp2=broker-A*3;}
 else {sl=tp1=tp2=broker;}

 document.getElementById("signal").innerText=signal;
 document.getElementById("signal").className="big "+signal.toLowerCase();
 document.getElementById("conf").innerText=conf+"%";
 document.getElementById("entry").innerText=broker.toFixed(2);
 document.getElementById("sl").innerText=sl.toFixed(2);
 document.getElementById("tp1").innerText=tp1.toFixed(2);
 document.getElementById("tp2").innerText=tp2.toFixed(2);
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
